<!-- The shop, as ig's model. Ids are stable; `at` is where the code lives. -->
<system id="shop">
  <app id="web" tech="Next.js" at="web/**">
    <calls to="api" label="POST /checkout"/>
  </app>

  <service id="api" tech="NestJS" at="api/**" owner="team-orders">
    <usecase id="checkout" at="src/checkout/**">
      <depends to="order"/>
      <calls to="payments"/>
    </usecase>
    <usecase id="refund" at="src/refund/**" moved-to="billing">
      <calls to="payments"/>
    </usecase>
    <domain id="order" at="src/domain/order/**"/>
    <port id="payments" at="src/ports/payments.ts">
      <calls to="stripe" label="charge, refund"/>
    </port>
  </service>

  <!-- planned: refunds get their own service -->
  <service id="billing" tech="NestJS" at="billing/**" planned>
    <usecase id="refund" at="src/refund/**">
      <calls to="stripe" label="refund"/>
    </usecase>
  </service>

  <store id="postgres" tech="PostgreSQL">
    <telemetry p95-ms="12" errors-per-min="0"/>
  </store>
  <external id="stripe"/>
</system>
