[package]
name = "ig-wire"
version.workspace = true
edition.workspace = true

# The composition root shared by the driving adapters (`ig` and `ig-desktop`): the real adapters
# plugged into `ig_app::Env`, and the debounced file watcher.
[dependencies]
ig-app = { path = "../ig-app" }
ig-conn-incus = { path = "../ig-conn-incus" }
ig-conn-traefik = { path = "../ig-conn-traefik" }
ig-core = { path = "../ig-core" }
ig-fs = { path = "../ig-fs" }
ig-git = { path = "../ig-git" }
ig-lang-py = { path = "../ig-lang-py" }
ig-lang-rs = { path = "../ig-lang-rs" }
ig-lang-ts = { path = "../ig-lang-ts" }
ig-schema = { path = "../ig-schema" }
notify = "8.2.0"
