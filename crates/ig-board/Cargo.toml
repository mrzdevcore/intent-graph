[package]
name = "ig-board"
version.workspace = true
edition.workspace = true

[dependencies]
ig-design = { path = "../ig-design" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
roughr = "=0.14.0"
lyon_tessellation = "=1.0.22"

# The renderer and the wasm bindings (src/web), wasm32 only: native builds and tests never see them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlVertexArrayObject",
  "WebGlUniformLocation",
  "WebGlTexture",
  "ImageBitmap",
] }
# roughr's rand 0.8 pulls getrandom 0.2, which needs `js` to build for wasm32; every sketch is
# seeded, so it is never called.
getrandom = { version = "=0.2.17", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]
