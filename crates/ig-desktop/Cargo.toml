[package]
name = "ig-desktop"
version.workspace = true
edition.workspace = true

# The desktop app: a Tauri shell around the viewer. A driving adapter, like the `ig` binary.
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
ig-app = { path = "../ig-app" }
ig-core = { path = "../ig-core" }
ig-wire = { path = "../ig-wire" }
serde_json = "1.0.154"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
