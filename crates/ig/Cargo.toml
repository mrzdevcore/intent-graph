[package]
name = "intent-graph"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
ast-grep-core = "0.51.0"
ast-grep-language = { version = "0.51.0", default-features = false, features = ["napi-lang"] }
globset = "0.4.20"
ig-core = { path = "../ig-core" }
json_comments = "0.2.2"
lexopt = "0.3.2"
notify = "8.2.0"
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_ast_visit = "0.133.0"
oxc_parser = "0.133.0"
oxc_resolver = "11.23.0"
oxc_semantic = "0.133.0"
oxc_span = "0.133.0"
oxc_syntax = "0.133.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", features = ["json"] }

[[bin]]
name = "ig"
path = "src/main.rs"
