[package]
name = "intent-graph"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
globset = "0.4.20"
ig-app = { path = "../ig-app" }
ig-core = { path = "../ig-core" }
ig-fs = { path = "../ig-fs" }
ig-git = { path = "../ig-git" }
ig-wire = { path = "../ig-wire" }
lexopt = "0.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", features = ["json"] }

[[bin]]
name = "ig"
path = "src/main.rs"
