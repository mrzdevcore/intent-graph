name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: macos-26, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - run: rustup target add ${{ matrix.target }}
      - run: make viewer
      - run: cargo build --release --locked -p intent-graph --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $version"; exit 1
          fi
          name="ig-$version-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/ig" LICENSE README.md "$name/"
          if [ -f crates/ig/assets/ig-map.5 ]; then cp crates/ig/assets/ig-map.5 "$name/"; fi
          tar -C "$name" -czf "$name.tar.gz" .
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ig-*.tar.gz*

  app:
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - run: rustup target add ${{ matrix.target }}
      - run: make app TARGET=${{ matrix.target }}
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="ig-app-$version-${{ matrix.target }}"
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/bundle/macos/ig.app" "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ig-app-*.zip*

  release:
    if: github.ref_type == 'tag'
    needs: [build, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ig ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Formula and cask
        run: |
          packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" dist > ig.rb && cat ig.rb
          packaging/homebrew/cask.sh "${GITHUB_REF_NAME#v}" dist > ig-app.rb && cat ig-app.rb
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN is not set: the tap was not updated"; exit 0; fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/mrzdevcore/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          cp ig.rb tap/Formula/ig.rb
          cp ig-app.rb tap/Casks/ig-app.rb
          cd tap
          git config user.name "ig release"
          git config user.email "release@ig.invalid"
          git add Formula/ig.rb Casks/ig-app.rb
          git commit -m "ig ${GITHUB_REF_NAME#v}"
          git push origin HEAD
